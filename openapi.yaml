openapi: 3.0.4

info:
  title: Webová aplikácia na úpravu obrázkov - BP 2025/2026 - xhumenp00
  description: |-
    Bakalárska práca 2025/2026, Fakulta informačných technológií, Vysoké učenie technické v Brne
  contact:
    name: Pavol Humený
    email: "pavol.humeny@gmail.com"
  version: 1.0.0
  
paths:
  /api/users:
    get:
      summary: Získanie všetkých používateľov a počet ich návštev
      responses:
        '200':
          description: Úspešné získanie používateľov
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post: 
      summary: Vytvorenie nového používateľa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  description: ID nového používateľa
      responses:
        '201':
          description: Používateľ úspešne vytvorený

  /api/users/{userId}/visits:
    get: 
      summary: Získanie návštev používateľa
      parameters:
        - name: userId
          in: path
          required: true
          description: ID používateľa
          schema:
            type: string
      responses:
        '200':
          description: Úspešné získanie návštev
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Visit'
    post:
      summary: Uloženie návštevy používateľa
      parameters:
        - name: userId
          in: path
          required: true
          description: ID používateľa
          schema:
            type: string
      responses:
        '201':
          description: Návšteva úspešne uložená

  /api/users/{userId}/events:
    get:
      summary: Získanie udalostí konkrétneho používateľa
      parameters:
        - name: userId
          in: path
          required: true
          description: ID používateľa
          schema:
            type: string
      responses:
        '200':
          description: Úspešné získanie udalostí používateľa
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
    post:
      summary: Uloženie udalosti používateľa
      parameters:
        - name: userId
          in: path
          required: true
          description: ID používateľa
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventInput'
      responses:
        '201':
          description: Udalosť úspešne uložená

  /api/events:
    get:
      summary: Získanie všetkých udalostí alebo filtrovanie podľa typu
      parameters:
        - name: eventType
          in: query
          required: false
          description: Typ udalosti (napr. "image_upload", "image_edit")
          schema:
            type: string
        - name: userId
          in: query
          required: false
          description: Filtrovanie podľa ID používateľa
          schema:
            type: string
        - name: dateFrom
          in: query
          required: false
          description: Začiatok časového intervalu 
          schema:
            type: string
            format: date-time
        - name: dateTo
          in: query
          required: false
          description: Koniec časového intervalu 
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Úspešné získanie udalostí daného typu
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: string
          description: ID používateľa
        visitCount:
          type: integer
          description: Počet návštev používateľa

    Visit:
      type: object
      properties:
        visitId:
          type: string
          description: ID návštevy
        timestamp:
          type: string
          format: date-time
          description: Čas návštevy

    EventInput:
      type: object
      properties:
        eventType:
          type: string
          description: Typ udalosti (napr. "image_upload", "image_edit")
        data:
          type: object
          description: Ďalšie dáta podľa typu udalosti
          additionalProperties: true
      required:
        - eventType

    Event:
      allOf:
        - $ref: '#/components/schemas/EventInput'
        - type: object
          properties:
            eventId:
              type: string
              description: ID udalosti
            userId:
              type: string
              description: ID používateľa, ktorý spôsobil udalosť
            timestamp:
              type: string
              format: date-time
              description: Čas udalosti (automaticky generovaný)
